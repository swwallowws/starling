name: CI

# Tests, the README's links, then the browser studio: built from this commit by
# scripts/deploy-web.sh and published to GitHub Pages on every push to main, so
# the live studio never drifts from the code. The full CREPE model is not in the
# repository (models/crepe-full.onnx), so the tests that need it skip; CREPE tiny,
# which the browser studio uses, is.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request touched, so each job below runs only when its part changed. On main
  # every job runs, since the deploy needs them all.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.parts.outputs.rust == 'true' }}
      studio: ${{ github.event_name != 'pull_request' || steps.parts.outputs.studio == 'true' }}
      readme: ${{ github.event_name != 'pull_request' || steps.parts.outputs.readme == 'true' }}
      code: ${{ github.event_name != 'pull_request' || steps.code.outputs.code == 'true' }}
    steps:
      # The Rust tests read the pitch models in models/ as well as crates/.
      - id: parts
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'models/**'
              - '.github/workflows/ci.yml'
            studio:
              - 'studio-ui/**'
              - '.github/workflows/ci.yml'
            readme:
              - 'README.md'
              - 'crates/voxmpe-core/README.md'
              - 'web/deploy/README.md'
              - 'media/**'
              - '.github/workflows/ci.yml'
      # The site builds from nearly everything: any file but pictures, docs and the top-level
      # notes (README.md, AGENTS.md...).
      - id: code
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!media/**'
              - '!docs/**'
              - '!*.md'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cpal (microphone input) needs the ALSA headers on Linux
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --locked --workspace
      - name: Clippy, warnings as errors
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  studio:
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - run: npm ci
      - run: npm test

  readme:
    needs: changes
    if: needs.changes.outputs.readme == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every link in the READMEs answers
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-loopback --max-retries 3 --accept 200,206,429 README.md crates/voxmpe-core/README.md web/deploy/README.md

  site:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - run: npm ci --prefix studio-ui
      - name: Build and stage the browser studio
        run: bash scripts/deploy-web.sh --stage _site
      - name: Stamp the build (the showcase compares it with its pictures)
        run: bash scripts/stamp-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [rust, studio, readme, site]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: The live studio answers (studio, demo, pitch model)
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" try/ crepe-tiny.onnx version.json; do
            ok=""
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS -o /dev/null "${BASE}${path}"; then ok=1; break; fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "not live: ${BASE}${path}"; exit 1; }
            echo "live: ${BASE}${path}"
          done
