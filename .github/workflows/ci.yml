name: CI

# The CREPE model is not in the repository (models/*.onnx), so the tests that need it
# skip; everything else runs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - run: npm ci
      - run: npm test
