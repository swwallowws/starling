[package]
name = "voxmidi-core"
version = "0.1.0"
edition = "2021"
description = "Shared voice-to-MPE-MIDI core: pitch, segmentation, and the freq->(note,bend) MPE primitive. Reused by singmidi and microtonal-aud2midi."

# Tuning-agnostic, numerically testable primitives shared by every voice->MIDI tool
# in the Playground. Note SELECTION (12-TET round vs scale-degree quantize) is
# deliberately NOT here — that is where consumers diverge. Zero dependencies for
# the interval/mpe layer; pitch/segment migration (phase 2) will add tract-onnx etc.
[lib]
name = "voxmidi_core"
path = "src/lib.rs"

[dependencies]
# ml inference (pure rust) — CREPE pitch front-end
tract-onnx = "0.21"
# numerics — spectral centroid feature
realfft = "3.4"
# midi serialization (MPE SMF writer)
midly = "0.5"
# ergonomics
anyhow = "1"
thiserror = "2"

# Optimize dependencies (notably tract) even in dev/test builds so model
# inference isn't unusably slow during development; our own crate stays debug.
[profile.dev.package."*"]
opt-level = 3
