<!doctype html>
<html lang="en" data-category="transcribe">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Try Starling</title>
    <link rel="icon" href="../favicons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="../favicons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../favicons/apple-touch-icon.png" />
    <script>
      // For framing (the showcase site): ?theme=paper|night picks the mode
      // before first paint, otherwise the system scheme applies. The demo
      // shell handles ?embed=1 itself once it loads.
      (function () {
        var t = new URLSearchParams(location.search).get("theme");
        if (t === "paper" || t === "night") document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="demo">
      <p id="message" class="try-message" role="status"></p>
      <div class="try-stage">
        <canvas id="roll"></canvas>
        <p id="empty" class="try-empty">The piano roll shows up here after a take.</p>
      </div>
      <div class="try-toolbar">
        <div class="try-toolbar-transport">
          <button id="record" type="button" data-icon="record" data-toggle data-pressed-icon="stop" data-key="r"></button>
          <button id="play" type="button" data-icon="play" data-toggle data-key="Space" disabled></button>
          <button id="sample" type="button" data-icon="loop" data-label="Use a sample take (coming soon)" disabled></button>
          <span id="rec-status" class="try-fine"></span>
        </div>
        <span class="try-toolbar-tuning try-tuning" role="radiogroup" aria-label="Tuning">
          <label><input type="radio" name="tuning" value="" checked disabled /> 12-TET</label>
          <label><input type="radio" name="tuning" value="53-edo" disabled /> 53-EDO makam</label>
        </span>
        <label id="smoothing-row" class="try-toolbar-smoothing" hidden>
          <span>Smoothing</span>
          <input id="smoothing" type="range" min="0" max="100" step="5" value="0" />
          <span id="smoothing-val">0%</span>
        </label>
      </div>
      <p class="try-fine">Takes stay in this browser and are never uploaded.</p>
    </div>
    <script type="module" src="/src/try/main.ts"></script>
  </body>
</html>
