# expressive-liveset is a private git dependency: fetch it with the system git,
# which has the SSH key, instead of Cargo's built-in client.
[net]
git-fetch-with-cli = true

# WebAssembly SIMD: about 1.5x faster CREPE in the browser (measured 2026-09-25).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
