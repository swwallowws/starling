[package]
name = "voxmpe-core"
version = "0.1.0"
edition = "2021"
description = "Singing voice to expressive MPE MIDI: CREPE pitch tracking, note segmentation, per-note bend and dynamics."

# Tuning-agnostic, numerically testable primitives shared by every voice->MIDI tool
# in the Playground. Note SELECTION (12-TET round vs scale-degree quantize) is
# deliberately NOT here, that is where consumers diverge. Zero dependencies for
# the interval/mpe layer; pitch/segment migration (phase 2) will add tract-onnx etc.
[lib]
name = "voxmpe_core"
path = "src/lib.rs"

[dependencies]
# ml inference (pure rust): CREPE pitch front-end
tract-onnx = "0.21"
# numerics: spectral centroid feature
realfft = "3.4"
# midi serialization (MPE SMF writer)
midly = "0.5"
# ergonomics
anyhow = "1"
thiserror = "2"

# tract pulls in getrandom, which needs its JS backend in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# Examples only; the library takes raw f32 samples and does no I/O.
hound = "3.5" # WAV read/write
cpal = "0.15" # mic capture (record_to_midi)
