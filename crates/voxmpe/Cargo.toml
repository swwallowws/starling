[package]
name = "voxmpe"
version = "0.1.0"
edition = "2021"
description = "Sing, get expressive MPE MIDI: a studio for tuning note splits by ear, any Scala tuning, and a CLI."

[lib]
name = "voxmpe"
path = "src/lib.rs"

[[bin]]
name = "voxmpe"
path = "src/main.rs"

[dependencies]
voxmpe-core = { path = "../voxmpe-core" }
hound = "3.5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
include_dir = "0.7"
expressive-liveset = { path = "../../../expressive-liveset" }

[dev-dependencies]
midly = "0.5"
flate2 = "1"
