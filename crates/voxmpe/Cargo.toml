[package]
name = "voxmpe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sing, get expressive MPE MIDI: a studio for tuning note splits by ear, any Scala tuning, and a CLI."

[lib]
name = "voxmpe"
path = "src/lib.rs"

[[bin]]
name = "voxmpe"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
# The CLI, the studio server and reading the model from disk. Off for the browser build.
native = ["dep:clap", "dep:tiny_http", "dep:include_dir"]

[dependencies]
voxmpe-core = { path = "../voxmpe-core" }
hound = "3.5"
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", optional = true }
include_dir = { version = "0.7", optional = true }
expressive-liveset = { git = "https://github.com/swwallowws/expressive-liveset.git", rev = "034837d72666c89493c6471af3a342cbe6d1d8c4" }

[dev-dependencies]
midly = "0.5"
flate2 = "1"
